name: Bug report
description: Something the tool did that it should not have, or did not do.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public. Do not paste your inventory, report files
        (report.md, report.csv, report.json), real item IDs, host names,
        owner names or any employer data.** Use made-up examples. The tool
        never needs them.
        For a security problem, do not open an issue. Use
        [private reporting](https://github.com/evemcgivern/software-lifecycle/security/advisories/new).
        If you need to show input, make a few rows with made-up names.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What the tool did, in plain words. Include any error text, with names removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran, and made-up input if it helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      description: The contents of the VERSION file.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: The output of python3 --version.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Your data
      options:
        - label: I have not included my own inventory data
          required: true
