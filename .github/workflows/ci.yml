name: CI

# Tests run on every pull request and push to main. The upstream format
# check runs weekly (and by hand) so a change in the KEV or endoflife.date
# format is noticed before the data jobs hit it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # Pinned so the Python 3.9 leg keeps working. 3.9 is past end of life
    # upstream: drop it when this image stops offering it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python3 -B -m unittest discover -s tests

  sbom:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the SBOM
        # The tool uses the Python standard library only, so the SBOM lists
        # the tool itself and no third-party components.
        run: |
          python3 -I - <<'EOF'
          import json, os
          version = open("VERSION", encoding="ascii").read().strip()
          ref = "software-lifecycle@" + version
          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "bom-ref": ref,
                      "name": "software-lifecycle",
                      "version": version,
                      "licenses": [{"license": {"id": "MIT"}}],
                      "externalReferences": [{
                          "type": "vcs",
                          "url": "https://github.com/" + os.environ["GITHUB_REPOSITORY"],
                      }],
                      "properties": [
                          {"name": "git-commit", "value": os.environ["GITHUB_SHA"]},
                          {"name": "runtime", "value": "Python 3.9 or newer, standard library only"},
                      ],
                  },
              },
              "components": [],
              "dependencies": [{"ref": ref, "dependsOn": []}],
          }
          with open("sbom.cdx.json", "w", encoding="ascii") as fh:
              json.dump(bom, fh, indent=2, sort_keys=True)
              fh.write("\n")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  upstream-format:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Fetch the live KEV catalog and check its format
        run: python3 -B refresh_data.py kev --out "$RUNNER_TEMP/kev"
      - name: Find the current upstream endoflife.date commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api repos/endoflife-date/endoflife.date/commits/HEAD --jq .sha)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "The upstream commit id has an unexpected form."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Build the endoflife.date snapshot and check its format
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: python3 -B refresh_data.py eol --upstream-commit "$UPSTREAM_SHA" --out "$RUNNER_TEMP/eol"
